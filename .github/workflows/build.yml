name: Build PS4 PKG
on: [workflow_dispatch]
env:
  DOTNET_ROLL_FORWARD: Major
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang lld unzip
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - name: Download OpenOrbis release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R OpenOrbis/OpenOrbis-PS4-Toolchain --pattern '*.tar.gz' --dir dl
          mkdir oo
          for t in dl/*.tar.gz; do tar -xzf "$t" -C oo; done
          BIN=$(find oo -type d -path '*/bin/linux' | head -n1)
          ROOT=$(realpath "$(dirname "$(dirname "$BIN")")")
          chmod -R +x "$BIN"
          echo "OO_PS4_TOOLCHAIN=$ROOT" >> "$GITHUB_ENV"
      - name: Build hello_world sample
        run: |
          cp -r "$OO_PS4_TOOLCHAIN/samples/hello_world" .
          find hello_world -type f | head -n 30
          cd hello_world && make
          find . -type f -name '*.pkg'
      - uses: actions/upload-artifact@v4
        with:
          name: ps4-pkg
          path: hello_world/**/*.pkg
          if-no-files-found: error
